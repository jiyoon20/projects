<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layout}">
<head>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
<div layout:fragment="content" class="container my-3 customer-list">
    <h2 class="mb-4">Order List</h2>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>Order ID</th>
            <th>Username</th>
            <th>Created At</th>
            <th>Total Price</th>
            <th>Status</th>
            <th>Order Items</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${paging.content}">
            <td th:text="${order.orderId}"></td>
            <td th:text="${order.cafeUser.username}"></td>
            <td th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm:ss')}"></td>
            <td th:text="'$'+${order.totalPrice}"></td>
            <td>
                <form th:action="@{/admin/order/status}" method="post">
                    <input type="hidden" th:name="orderId" th:value="${order.orderId}">
                    <select name="orderStatus" class="form-select form-select-sm d-inline w-auto">
                             <option th:each="status : ${T(me.jooie.minicafe.domain.OrderStatus).values()}"
                                th:value="${status}" th:text="${status}"
                                th:selected="${status.name() == order.orderStatus.name()}">
                        </option>
                    </select>
                    <button type="submit" class="btn btn-outline-secondary btn-sm border-0">
                        <i class="bi bi-check-square fs-5"></i>
                    </button>
                </form>
            </td>
            <td>
                <ul>
                    <li th:each="item : ${order.orderItemList}">
                        <span th:text="|${item.menuTitle} x ${item.quantity} ($${item.price})|"></span>
                    </li>
                </ul>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${!paging.isEmpty()}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${!paging.hasPrevious} ? 'disabled'">
                <a class="page-link" th:href="@{|?page=${paging.number-1}|}">Prev</a>
            </li>
            <li th:each="page : ${#numbers.sequence(0, paging.totalPages-1)}"
                th:classappend="${page == paging.number} ? 'active'" class="page-item">
                <a th:text="${page}" class="page-link" th:href="@{|?page=${page}|}"></a>
            </li>
            <li class="page-item" th:classappend="${!paging.hasNext} ? 'disabled'">
                <a class="page-link" th:href="@{|?page=${paging.number+1}|}">Next</a>
            </li>
        </ul>
    </div>
</div>

</body>
</html>

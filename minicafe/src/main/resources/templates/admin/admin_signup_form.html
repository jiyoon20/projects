<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<div layout:fragment="content" class="container my-3">
  <div class="my-3 border-bottom">
    <h4>Administration Registration</h4>
  </div>
  <form th:action="@{/admin/signup}" th:object="${adminCreateDto}" method="post">
    <div th:replace="~{form_errors :: formErrorsFragment}"></div>

    <div class="mb-3">
      <label for="username" class="form-label">User id</label>
      <input type="text" th:field="*{username}" class="form-control" id="username">
    </div>
    <div class="mb-3">
      <label for="password1" class="form-label">Password</label>
      <input type="password" th:field="*{password1}" class="form-control" id="password1">
    </div>
    <div class="mb-3">
      <label for="password2" class="form-label">Password Confirmation</label>
      <input type="password" th:field="*{password2}" class="form-control" id="password2">
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Email Address</label>
      <input type="email" th:field="*{email}" class="form-control" id="email">
    </div>
    <button type="submit" class="btn btn-primary">Register</button>
  </form>
</div>
</html>

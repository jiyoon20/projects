<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Register Menu</title>
    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded",function(){
            const previewImage = document.getElementById("imagePreview");
            const defaultImageUrl = /*[[${defaultImageUrl}]]*/ "";
            previewImage.src = defaultImageUrl;
        });

        function updatePreview() {
            const imageName = document.getElementById('imageSelector').value;
            const previewImage = document.getElementById('imagePreview');
            const defaultImageUrl = /*[[${defaultImageUrl}]]*/"";
            if (imageName) {
                previewImage.src = imageName;
            } else {
                previewImage.src = defaultImageUrl;
            }
        }

        function updateImagePath() {
            const imageName = document.getElementById('imageSelector').value;
            document.getElementById('coffeeImageUrl').value = imageName;
            updatePreview();
        }

        function uploadImageToS3() {
        const fileInput = document.getElementById("fileInput");
        const file = fileInput.files[0];
        if (!file) {
            alert("Select a file to upload.");
            return;
        }

        const formData = new FormData();
        formData.append("file", file);

        fetch("/admin/upload/images", {
            method: "POST",
            body: formData,
            headers: {
                'X-CSRF-TOKEN': document.querySelector('input[name="_csrf"]').value
            }
        })
        .then(response => {
            if (!response.ok) throw new Error("Upload Fail");
            return response.json();
        })
        .then(data => {
            alert("Success!\nFilename: " + data.fileName);
        })
        .catch(error => {
            alert("Error: " + error.message);
        });
    }

    </script>
</head>
<div layout:fragment="content" class="container my-3">
    <h4 th:text="${menuCreateDto.menuId == null ? 'Add New Menu' : 'Edit Menu'}"></h4>
    <form th:action="@{${menuCreateDto.menuId == null ? '/menu/create' : '/menu/modify/' + menuCreateDto.menuId}}"
          method="post" th:object="${menuCreateDto}">
        <div class="mb-3">
            <label for="imageSelector" class="form-label">Choose Coffee Image</label>
            <select class="form-control" id="imageSelector" name="selectedImage" onchange="updateImagePath()">
                <option value="">-- Select Image --</option>
                <option th:each="image : ${imageList}" th:value="${image}" th:text="${image}"></option>
            </select>
        </div>
        <input type="hidden" name="coffeeImageUrl" id="coffeeImageUrl" th:field="*{coffeeImageUrl}">
        <div class="mb-3">
            <label class="form-label">Image Preview</label><br>
            <img id="imagePreview" th:src="${defaultImageUrl}" alt="Selected Image" style="max-width: 200px; max-height: 200">
        </div>
        <div class="mb-3">
            <label for="title" class="form-label"> Coffee Name </label>
            <input type="text" name="title" id="title" class="form-control" th:field="*{title}" required>
            <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="text-danger"></p>
        </div>
        <div class="mb-3">
            <label for="price" class="form-label"> Price </label>
            <input type="number" name="price" id="price" class="form-control" th:field="*{price}" min="0" step="0.01" required>
            <p th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="text-danger"></p>
        </div>
        <div class="mb-3">
            <label for="content" class="form-label"> Description </label>
            <input type="text" name="content" id="content" class="form-control" th:field="*{content}">
        </div>
        <div class="mb-3">
            <label for="calories" class="form-label"> Calories </label>
            <input type="number" name="calories" id="calories" class="form-control" th:field="*{calories}" min="0" step="0.01">
            <p th:if="${#fields.hasErrors('calories')}" th:errors="*{calories}" class="text-danger"></p>
        </div>
        <input type="submit" value="Save" class="btn btn-primary my-2">
    </form>

    <h5>Upload Images</h5>
    <form onsubmit="event.preventDefault(); uploadImageToS3();" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="fileInput" class="form-label">Choose Image to Upload</label>
            <input type="file" id="fileInput" name="file" class="form-control" required />
        </div>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit" class="btn btn-primary">Upload Image</button>
    </form>
</div>
</html>

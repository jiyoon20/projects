<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout}">

<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
<div layout:fragment="content" class="container my-4">
  <h2 class="mb-4">🛒 Your Cart</h2>

  <div th:if="${cartlist != null and cartlist.size() > 0}">
    <div th:each="cartItem : ${cartlist}" class="card mb-3 shadow-sm">
      <div class="card-body d-flex align-items-center">
        <img th:src="${cartItem.menu.coffeeImageUrl != null ? cartItem.menu.coffeeImageUrl : '/images/logo.jpg'}"
             class="rounded" style="height: 60px; width: 60px; object-fit: cover; margin-right: 15px;">

        <div class="flex-grow-1">
          <h5 class="mb-1" th:text="${cartItem.menu.title != null ? cartItem.menu.title : 'Unknown Menu'}"></h5>

          <form th:action="@{/cart/update}" method="post" class="d-inline">
            <input type="hidden" name="menuId" th:value="${cartItem.menu.menuId}"/>
            <button type="submit" name="action" value="decrease" class="btn btn-link p-0 me-2">
              <i class="bi bi-arrow-down-square-fill fs-5" style="color: #6f4f37;"></i> <!-- 커피색 -->
            </button>
            <span class="mx-2 fw-bold" th:text="${cartItem.quantity}"></span>
            <button type="submit" name="action" value="increase" class="btn btn-link p-0 ms-2">
              <i class="bi bi-arrow-up-square-fill fs-5" style="color: #6f4f37;"></i> <!-- 커피색 -->
            </button>
          </form>
        </div>

        <div class="text-end">
          <span class="fw-bold text-success" th:text="'$' + ${cartItem.menu.price * cartItem.quantity}"></span>
        </div>
      </div>
    </div>

    <div class="text-end mt-4">
      <h4>Total Amount: <span class="text-primary" th:text="'$' + ${totalAmount}"></span></h4>
    </div>

    <form th:action="@{/order/submit}" method="post" class="orderSubmit mt-4">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button type="submit" class="btn btn-primary">Order</button>
    </form>
  </div>


  <p th:if="${cartlist == null or cartlist.size() == 0}" class="text-center text-muted fs-5">Your cart is empty.</p>
</div>

<style>
  h2 {
    font-weight: 600;
    color: #6f4f37;
  }

  .card {
    border: 1px solid #eaeaea;
    border-radius: 12px;
  }

  .text-success {
    color: #4b6f44 !important;
  }

  .text-primary {
    color: #6f4f37 !important;
  }
</style>
</body>
</html>
